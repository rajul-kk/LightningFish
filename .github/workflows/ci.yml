name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy lightningfish_core lightningfish_service lightningfish_finance lightningfish_coding
        env:
          ANTHROPIC_API_KEY: sk-test-placeholder

      - name: Run tests
        run: pytest --tb=short -q
        env:
          # Tests mock the Anthropic client; no real key needed.
          # Set a placeholder so any accidental un-mocked call fails loudly.
          ANTHROPIC_API_KEY: sk-test-placeholder

  web:
    name: Web type-check & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lightningfish_web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lightningfish_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
        env:
          # Clerk requires a publishable key at type-check time; use a valid-format placeholder.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_bGlnaHRuaW5nZmlzaC5sb2NhbGhvc3Qk
          CLERK_SECRET_KEY: sk_test_placeholder
          PYTHON_SERVICE_URL: http://localhost:8000

      - name: Lint
        run: npx eslint .
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_bGlnaHRuaW5nZmlzaC5sb2NhbGhvc3Qk
          CLERK_SECRET_KEY: sk_test_placeholder
          PYTHON_SERVICE_URL: http://localhost:8000
