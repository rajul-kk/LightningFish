[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightningfish"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "scipy>=1.12.0",
    "networkx>=3.0.0",
    "yfinance>=0.2.40",
    "sec-edgar-downloader>=5.0.0",
    "requests>=2.31.0",
    "praw>=7.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "psycopg2-binary>=2.9.0",
    "httpx>=0.27.0",
    "fastapi[standard]>=0.115.0",
    "slowapi>=0.1.9",
    "openai>=1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lightningfish_core", "lightningfish_finance", "lightningfish_coding", "lightningfish_hn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle errors, pyflakes, isort
ignore = [
    "E402",  # module-level import order — intentional in main.py (sys.path setup)
    "E501",  # line too long — prompts and long f-strings are exempt
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
